<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频在线剪辑器</title>
  <link rel="stylesheet" href="/static/editor.css">
</head>
<body>
  <div class="editor-container">
    <header class="editor-header">
      <div class="header-left">
        <button class="btn btn-secondary" onclick="goBack()">← 返回</button>
        <input type="text" id="projectName" class="project-name" value="未命名项目" onchange="updateProjectName()">
      </div>
      <div class="header-center">
        <div class="transport-controls">
          <button class="btn btn-icon" title="撤销" id="undoBtn" onclick="undo()" disabled>↶</button>
          <button class="btn btn-icon" title="重做" id="redoBtn" onclick="redo()" disabled>↷</button>
          <button class="btn btn-icon" title="跳到开始" onclick="seekTo(0)">⏮</button>
          <button class="btn btn-icon" title="后退一帧" onclick="stepBackward()">◀◀</button>
          <button class="btn btn-primary btn-play" id="playBtn" onclick="togglePlay()">▶</button>
          <button class="btn btn-icon" title="前进一帧" onclick="stepForward()">▶▶</button>
          <button class="btn btn-icon" title="跳到结束" onclick="seekTo(duration)">⏭</button>
        </div>
        <div class="time-display">
          <span id="currentTime">00:00:00.000</span> / <span id="totalTime">00:00:00.000</span>
        </div>
      </div>
      <div class="header-right">
        <button class="btn btn-secondary" onclick="openExportModal()">导出视频</button>
        <button class="btn btn-primary" onclick="saveProject()">保存</button>
      </div>
    </header>

    <div class="editor-main">
      <aside class="sidebar-left">
        <div class="sidebar-tabs">
          <button class="tab-btn active" data-tab="media">媒体库</button>
          <button class="tab-btn" data-tab="effects">效果</button>
          <button class="tab-btn" data-tab="text">文字</button>
          <button class="tab-btn" data-tab="audio">音频</button>
        </div>
        
        <div class="tab-content active" id="mediaTab">
          <div class="media-upload">
            <div class="upload-area" id="uploadArea">
              <input type="file" id="fileInput" accept="video/*,audio/*,image/*" multiple style="display:none;">
              <div class="upload-icon">+</div>
              <div class="upload-text">拖拽文件到此处或点击上传</div>
            </div>
          </div>
          <div class="media-list" id="mediaList"></div>
        </div>

        <div class="tab-content" id="effectsTab">
          <div class="effect-category">
            <h4>转场效果</h4>
            <div class="effect-grid">
              <div class="effect-item" data-type="FADE">
                <div class="effect-preview fade"></div>
                <span>淡入淡出</span>
              </div>
              <div class="effect-item" data-type="DISSOLVE">
                <div class="effect-preview dissolve"></div>
                <span>叠化</span>
              </div>
              <div class="effect-item" data-type="SLIDE_LEFT">
                <div class="effect-preview slide-left"></div>
                <span>左滑</span>
              </div>
              <div class="effect-item" data-type="SLIDE_RIGHT">
                <div class="effect-preview slide-right"></div>
                <span>右滑</span>
              </div>
            </div>
          </div>
          <div class="effect-category">
            <h4>滤镜效果</h4>
            <div class="effect-grid">
              <div class="effect-item" data-filter="BRIGHTNESS">亮度</div>
              <div class="effect-item" data-filter="CONTRAST">对比度</div>
              <div class="effect-item" data-filter="SATURATION">饱和度</div>
              <div class="effect-item" data-filter="GRAYSCALE">灰度</div>
              <div class="effect-item" data-filter="SEPIA">复古</div>
              <div class="effect-item" data-filter="BLUR">模糊</div>
              <div class="effect-item" data-filter="VINTAGE">怀旧</div>
              <div class="effect-item" data-filter="CINEMATIC">电影</div>
            </div>
          </div>
        </div>

        <div class="tab-content" id="textTab">
          <div class="text-presets">
            <div class="text-preset" data-type="TITLE">
                <div class="preset-preview title">标题</div>
                <span>标题</span>
              </div>
              <div class="text-preset" data-type="SUBTITLE">
                <div class="preset-preview subtitle">字幕</div>
                <span>字幕</span>
              </div>
              <div class="text-preset" data-type="WATERMARK">
                <div class="preset-preview watermark">水印</div>
                <span>水印</span>
              </div>
          </div>
        </div>

        <div class="tab-content" id="audioTab">
          <div class="audio-controls">
            <div class="control-group">
              <label>音量</label>
              <input type="range" id="volumeSlider" min="0" max="200" value="100">
              <span id="volumeValue">100%</span>
            </div>
            <div class="control-group">
              <label>淡入时长 (秒)</label>
              <input type="number" id="fadeInDuration" min="0" max="10" step="0.1" value="0">
            </div>
            <div class="control-group">
              <label>淡出时长 (秒)</label>
              <input type="number" id="fadeOutDuration" min="0" max="10" step="0.1" value="0">
            </div>
            <button class="btn btn-secondary w-full" onclick="applyAudioEffect()">应用音频效果</button>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <div class="preview-container">
          <div class="preview-wrapper" id="previewWrapper">
            <div class="composition-layer" id="compositionLayer"></div>
            <div class="text-overlay" id="textOverlay"></div>
          </div>
          <canvas id="previewCanvas" style="display:none;"></canvas>
        </div>

        <div class="timeline-container">
          <div class="timeline-left">
            <div class="timeline-controls">
              <button class="btn btn-icon" onclick="zoomIn()">+</button>
              <button class="btn btn-icon" onclick="zoomOut()">-</button>
              <button class="btn btn-icon" onclick="fitToWindow()">⤢</button>
            </div>
            <div class="track-headers" id="trackHeaders"></div>
          </div>
          <div class="timeline-right" id="timelineRight">
            <div class="timeline-scroll-content" id="timelineScrollContent">
              <div class="ruler-area">
                <div class="ruler" id="timelineRuler"></div>
                <div class="playhead" id="playhead"></div>
              </div>
              <div class="tracks-area" id="tracksArea"></div>
            </div>
          </div>
        </div>
      </main>

      <aside class="sidebar-right">
        <div class="properties-panel">
          <h3>属性</h3>
          <div id="propertiesContent">
            <p class="empty-state">选择一个片段或轨道来查看属性</p>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <div class="modal" id="exportModal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>导出视频</h3>
        <button class="close-btn" onclick="closeExportModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>格式</label>
          <select id="exportFormat">
            <option value="mp4">MP4 (H.264)</option>
            <option value="webm">WebM (VP9)</option>
            <option value="mov">MOV (H.264)</option>
            <option value="mkv">MKV (H.265)</option>
          </select>
        </div>
        <div class="form-group">
          <label>分辨率</label>
          <select id="exportResolution">
            <option value="1920x1080">1920x1080 (1080p)</option>
            <option value="1280x720">1280x720 (720p)</option>
            <option value="3840x2160">3840x2160 (4K)</option>
            <option value="854x480">854x480 (480p)</option>
          </select>
        </div>
        <div class="form-group">
          <label>帧率</label>
          <select id="exportFps">
            <option value="30">30 fps</option>
            <option value="60">60 fps</option>
            <option value="24">24 fps</option>
            <option value="25">25 fps</option>
          </select>
        </div>
        <div class="form-group">
          <label>质量</label>
          <select id="exportQuality">
            <option value="high">高质量</option>
            <option value="medium">中等质量</option>
            <option value="low">低质量</option>
          </select>
        </div>
        <div class="form-group">
          <label>视频码率 (Mbps)</label>
          <input type="number" id="exportBitrate" min="1" max="50" value="8">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeExportModal()">取消</button>
        <button class="btn btn-primary" onclick="startExport()">开始导出</button>
      </div>
    </div>
  </div>

  <div class="export-progress" id="exportProgress" style="display:none;">
    <div class="progress-content">
      <h4>正在导出视频...</h4>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">0%</div>
    </div>
  </div>

  <script src="/static/editor.js"></script>
</body>
</html>
