<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直播观看 - Media Service</title>
    <link rel="stylesheet" href="/static/live.css">
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-container">
            <h1>🎬 进入直播间</h1>
            <p class="login-subtitle">请输入观看密码</p>
            <form id="loginForm">
                <div class="form-group">
                    <input type="text" id="userName" placeholder="请输入昵称" required maxlength="20">
                </div>
                <div class="form-group">
                    <input type="password" id="roomPassword" placeholder="请输入观看密码" required>
                </div>
                <button type="submit" class="btn-primary">进入直播</button>
            </form>
            <div id="loginError" class="error-message"></div>
        </div>
    </div>

    <div id="liveScreen" class="live-screen" style="display: none;">
        <div class="live-container">
            <div class="video-section">
                <div class="video-wrapper">
                    <video
                        id="videoPlayer"
                        controls
                        autoplay
                        muted
                        playsinline
                    ></video>
                    <div id="danmakuLayer" class="danmaku-layer"></div>
                    <div id="liveStatus" class="live-status">
                        <span class="status-dot"></span>
                        <span id="statusText">直播中</span>
                    </div>
                    <div id="playerLoading" class="player-loading">
                        <div class="loading-spinner"></div>
                        <p>正在加载直播...</p>
                    </div>
                </div>

                <div class="video-info-bar">
                    <div class="room-info">
                        <h2 id="roomTitle">直播间标题</h2>
                        <div class="room-meta">
                            <span id="viewerCount">👥 0 人观看</span>
                            <span id="likeCount">❤️ 0 点赞</span>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <div class="quality-selector">
                            <label for="qualitySelect">清晰度:</label>
                            <select id="qualitySelect">
                                <option value="original">原画</option>
                            </select>
                        </div>
                        <button id="likeBtn" class="btn-like">
                            <span class="heart">❤️</span>
                            <span>点赞</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="sidebar">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="chat">聊天</button>
                    <button class="tab-btn" data-tab="gift">礼物</button>
                    <button class="tab-btn" data-tab="rank">榜单</button>
                </div>

                <div id="chatPanel" class="tab-panel active">
                    <div id="chatMessages" class="chat-messages"></div>
                    <div class="danmaku-input-area">
                        <div class="danmaku-options">
                            <label class="option-label">
                                <input type="checkbox" id="showDanmaku" checked>
                                <span>显示弹幕</span>
                            </label>
                            <div class="color-picker">
                                <label>颜色:</label>
                                <input type="color" id="danmakuColor" value="#FFFFFF">
                            </div>
                        </div>
                        <div class="input-row">
                            <input type="text" id="danmakuInput" placeholder="发送弹幕..." maxlength="100">
                            <button id="sendDanmakuBtn" class="btn-send">发送</button>
                        </div>
                    </div>
                </div>

                <div id="giftPanel" class="tab-panel">
                    <div class="gift-list" id="giftList"></div>
                    <div class="gift-history">
                        <h3>礼物记录</h3>
                        <div id="giftHistory" class="gift-history-list"></div>
                    </div>
                </div>

                <div id="rankPanel" class="tab-panel">
                    <div class="rank-section">
                        <h3>贡献榜</h3>
                        <div id="rankList" class="rank-list"></div>
                    </div>
                    <div class="online-section">
                        <h3>在线观众</h3>
                        <div id="onlineList" class="online-list"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="giftAnimation" class="gift-animation"></div>
    </div>

    <script src="https://unpkg.com/hls.js@1.4.12/dist/hls.min.js"></script>
    <script src="https://unpkg.com/flv.js@1.6.2/dist/flv.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/static/live.js"></script>
</body>
</html>
